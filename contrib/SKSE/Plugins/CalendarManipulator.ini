[General]
; Number of days each in-game month lasts (1-31).
; When the day of the month exceeds this value, the calendar jumps to the 1st of the next month.
; Note: months that naturally have fewer days (e.g. Sun's Dawn = 28) are unaffected if this is larger.
daysPerMonth = 31

; Compatibility for mods that make each month a season (e.g. Faster Seasons).
; When true, the year advances on every Winter -> Spring transition
; (Sun's Dawn -> First Seed, Mid Year -> Sun's Height, Frostfall -> Sun's Dusk)
; instead of at Evening Star -> Morning Star.
MonthlySeasons = false

; When true, shows a notification on the 1st of every new month.
; With MonthlySeasons enabled, the message describes the new season instead.
DisplayNotifications = true
